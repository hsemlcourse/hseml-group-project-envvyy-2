version: '3.8'

services:
  # API сервер для предсказаний
  api:
    build: .
    container_name: twitch_ml_api
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: python api.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Streamlit веб-интерфейс
  streamlit:
    build: .
    container_name: twitch_ml_streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data/processed:/app/data/processed
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Jupyter для анализа (опционально)
  jupyter:
    build: .
    container_name: twitch_ml_jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./notebooks:/app/notebooks
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    profiles:
      - jupyter